[package]
name = "screencapture-core"
description = "What every screencapture feature stands on: screens, selection, config, daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
futures.workspace = true
smallvec.workspace = true
anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd.workspace = true
libc.workspace = true
memmap2 = { workspace = true, optional = true }
wayland-client = { workspace = true, optional = true }
wayland-protocols = { workspace = true, optional = true }
wayland-protocols-wlr = { workspace = true, optional = true }
xcap = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(not(target_os = "linux"))'.dependencies]
xcap.workspace = true

[features]
# Alone (its own tests), the core builds for Wayland; the program picks through its features.
default = ["wayland"]
# Native wlr-screencopy capture and the Wayland clipboard.
wayland = [
    "gpui_platform/wayland",
    "dep:memmap2", "dep:wayland-client", "dep:wayland-protocols", "dep:wayland-protocols-wlr"]
# xcap capture.
x11 = ["gpui_platform/x11", "dep:xcap"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
